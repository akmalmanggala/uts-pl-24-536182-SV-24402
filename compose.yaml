services:
  # -------------------------------------------------------------
  # 1. Database Service (MySQL 8.0 with Persistent Named Volume)
  # -------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: uts-kopi-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_kopi_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-kopi_db}
      MYSQL_USER: ${DB_USERNAME:-kopi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kopi_secret_pass}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - kopi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_kopi_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------
  # 2. Backend Service (FrankenPHP Application Server + Healthcheck + Logging)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uts-kopi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "${APP_NAME:-Kopi Nusantara API}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:7K5pI0hL8Z2PqM9V5bB3cN4eE6fG7hH8jJ9kL0mN1oP=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      LOG_CHANNEL: stdout
      LOG_LEVEL: debug
      CACHE_STORE: file
      CACHE_DRIVER: file
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kopi_db}
      DB_USERNAME: ${DB_USERNAME:-kopi_user}
      DB_PASSWORD: ${DB_PASSWORD:-kopi_secret_pass}
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kopi-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------
  # 3. Frontend Service (Vue.js SPA served with Nginx Alpine)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: uts-kopi-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - kopi-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------
  # 4. Prometheus Monitoring Service (Metrics Collection & Alerts)
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: uts-kopi-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - kopi-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------
  # 5. Grafana Visualization & Analytics Dashboard
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: uts-kopi-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - kopi-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------
  # 6. cAdvisor (Container Resource Usage & Performance Monitoring)
  # -------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: uts-kopi-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=5s"
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kopi-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------
  # 7. Node Exporter (Host & OS Hardware Metrics Exporter)
  # -------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: uts-kopi-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - kopi-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kopi-network:
    driver: bridge

volumes:
  db_data:
    name: uts_kopi_db_data
  prometheus_data:
    name: uts_kopi_prometheus_data
  grafana_data:
    name: uts_kopi_grafana_data

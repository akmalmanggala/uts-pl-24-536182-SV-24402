name: CI/CD Pipeline - UTS KEPL 2026

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  # =============================================================
  # Job 1: Test Backend (Migrations & PHPUnit Feature Tests)
  # =============================================================
  backend-test:
    name: Backend Test (Laravel + PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, sqlite3, pdo_sqlite, bcmath, pcntl, intl, zip
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Prepare Environment File
        working-directory: backend
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite

      - name: Install Composer Dependencies
        working-directory: backend
        run: composer install --no-scripts --prefer-dist --no-interaction --no-progress

      - name: Generate Application Key and Discover Packages
        working-directory: backend
        run: |
          php artisan key:generate --ansi
          php artisan package:discover --ansi

      - name: Run Backend Feature & Unit Tests
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --colors=always

  # =============================================================
  # Job 2: Build Frontend (Vue 3 + Vite)
  # =============================================================
  frontend-build:
    name: Frontend Build (Vue 3 + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

      - name: Verify Build Artifacts
        working-directory: frontend
        run: |
          test -d dist
          test -f dist/index.html
          echo "Frontend build successfully verified."

  # =============================================================
  # Job 3: Deploy to GHCR (Runs ONLY on Push to 'main')
  # =============================================================
  deploy:
    name: Deploy to GHCR (ghcr.io)
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Repository Owner in Lowercase
        id: repo-owner
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner_lc }}/uts-kopi-backend:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner_lc }}/uts-kopi-backend:latest

      - name: Build and Push Frontend Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner_lc }}/uts-kopi-frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner_lc }}/uts-kopi-frontend:latest
